<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MIDIbox SEQ – 4x OLED panel (design)</title>
<style>
:root{--amber:#FFB547;--bg:#16181b;--btn:#1b1d20;--btn2:#202226}
body{margin:0;background:#0c0d0f;color:#ccc;font:11px -apple-system,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
#wrap{position:relative;width:1545px;height:470px;margin:18px;background:linear-gradient(#1f2125,#17191c);border-radius:12px;
      box-shadow:0 24px 60px #000a,0 0 0 1px #000;transform-origin:top center}
.abs{position:absolute}
.grp2{position:absolute;font-size:9px;color:#9a9a9a;letter-spacing:.06em;text-align:center}
/* Keys = MX switch (opaque housing, LED window) + SK6812 + smoked translucent 1U cap, 18 x 18 mm, real size.
   Off: almost black. On: the whole cap glows in the LED colour (light stays in the cap: no pudding skirt). */
.btn{position:absolute;width:50px;height:40px;border-radius:6px;background:radial-gradient(ellipse at 50% 40%,#2a2c30 0%,#1a1b1e 70%,#141517 100%);border:1px solid #0a0a0b;box-sizing:border-box;box-shadow:0 2px 3px #000c,inset 0 1px 0 #3a3c41;cursor:pointer;touch-action:none}
.btn.on{background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--c,#FFB547) 80%,#fff) 0%,color-mix(in srgb,var(--c,#FFB547) 55%,#111) 55%,color-mix(in srgb,var(--c,#FFB547) 30%,#0b0b0c) 100%);box-shadow:0 0 10px color-mix(in srgb,var(--c,#FFB547) 60%,transparent),inset 0 1px 0 #ffffff40}
.btn.play{box-shadow:0 0 16px 3px #ffffffcc,0 0 4px #fff !important}
.btn.page{background:radial-gradient(ellipse at 50% 45%,#fffaf2 0%,#bfb3a0 55%,#4d473f 100%);box-shadow:0 0 10px #FFF0DA88}
/* front plate: one cutout per row of keys (panel material only between rows and groups) */
.btn.small{border-radius:3px;border-color:#2a2c30;box-shadow:0 1px 2px #000c,inset 0 0 0 1px #ffffff14}
/* small keys: APEM 1T16 cap = frosted white (no smoked version exists): milky white when off, glows in the LED colour when on */
.btn.small:not(.on){background:radial-gradient(ellipse at 50% 40%,#e4e1da 0%,#c9c5bd 60%,#a9a59d 100%);border-color:#6f6c66;box-shadow:0 1px 2px #000c,inset 0 1px 0 #ffffff80}
.btn.small.on{border-color:#6f6c66;background:radial-gradient(ellipse at 50% 45%,#ffffff 0%,color-mix(in srgb,var(--c,#FFB547) 65%,#fff) 45%,color-mix(in srgb,var(--c,#FFB547) 90%,#c8c4bc) 100%);box-shadow:0 0 14px color-mix(in srgb,var(--c,#FFB547) 75%,transparent),inset 0 1px 0 #ffffffa0}
/* compare: round 1U16 caps instead of the square 1T16 (key C, or ?caps=round) */
body.roundcaps .btn.small,body.roundcaps .cut.scut{border-radius:50%}
/* solid (opaque) 1T caps: no light through the cap, the LED is useless with them */
.btn.small.opq,.btn.small.opq.on{background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--capc) 85%,#fff) 0%,var(--capc) 60%,color-mix(in srgb,var(--capc) 70%,#000) 100%);box-shadow:0 1px 2px #000c,inset 0 1px 0 #ffffff30;border-color:#0008}
.cut{position:absolute;background:#08090a;border-radius:4px;box-shadow:inset 0 2px 4px #000}
.btn.down{transform:translateY(2px);box-shadow:0 1px 1px #000c}.btn.latched{outline:2px solid #ffc400}.btn.na{opacity:.4;cursor:not-allowed}
.lbl{position:absolute;width:70px;text-align:center;font-size:10px;font-weight:600;letter-spacing:.05em;color:#f0f0f0;white-space:nowrap}
.side{position:absolute;font-size:9px;color:#aaa}
.enc.pushed{box-shadow:inset 0 0 0 2px #FFB547,0 0 10px #FFB547}
.enc{position:absolute;width:34px;height:34px;border-radius:50%;background:#111214;box-shadow:inset 0 0 0 2px #2c2f34,0 3px 8px #000a;cursor:ns-resize}
.enc i{position:absolute;left:calc(50% - 1.5px);top:3px;width:3px;height:11px;border-radius:2px;background:#d7dade;transform-origin:50% 14px;transform:rotate(var(--a,0deg))}
.encn{position:absolute;width:34px;text-align:center;font-size:8px;color:#888}
.pcb{position:absolute;border:1px dashed #3a3d42;border-radius:2px;box-sizing:border-box}
.bezel{position:absolute;background:#050506;border-radius:2px;box-shadow:inset 0 0 0 1px #2a2c30}
.opening{position:absolute;box-shadow:inset 0 0 0 1px #1c1e22}
.oled{position:absolute;width:250px;height:62px;background:#000;border-radius:2px}   /* canvas is 4x internally and scaled down smoothly: pixelated downscaling dropped pixel rows (flat text) */
.brk{position:absolute;height:5px;border:1px solid #c78a2a;border-top:0;width:248px}
.hdr{position:absolute;left:30px;top:22px;font-size:10px;letter-spacing:.1em;color:var(--amber)}
.hdr b{color:#fff}
.grp{position:absolute;font-size:8px;letter-spacing:.12em;font-weight:700;text-align:center;width:50px}
.dw{position:absolute;left:781px;top:297px;width:100px;height:100px;border-radius:50%;background:#111214;box-shadow:inset 0 0 0 2px #2c2f34,0 6px 14px #000a;cursor:ns-resize}
.dw i{position:absolute;left:62%;top:16%;width:18%;height:18%;border-radius:50%;background:#2a2d31;box-shadow:inset 0 0 0 1px #44484e}
.beat{position:absolute;left:822px;top:223px;width:18px;height:18px;border-radius:50%;background:#3a1c1c}
.beat.on{background:#FFB547;box-shadow:0 0 14px #FFB547}
.top{font-size:11px;color:#888;margin-bottom:6px}.top a{color:#9cf}
#st.on{color:#7cff8a}#st.off{color:#f66}
.foot{position:absolute;left:30px;bottom:12px;font-size:12px;letter-spacing:.1em;color:#ddd;font-weight:700}.foot b{color:var(--amber)}
</style></head><body>
<div class="top">4x OLED (256x64) design · SEQ: <b id="st" class="off">offline</b> · <a href="#" id="sync">refresh screen</a> · <a href="/">old panel</a>
 · click = button, right-click = latch, encoder: scroll/drag</div>
<div id="wrap"></div>
<script>
const W=document.getElementById('wrap');
// LED palette: warm, matches the amber OLEDs. Small keys use standard one-colour 3 mm LEDs (warm white, amber, red).
const PAL={amber:'#FFB547', white:'#FFF0DA', rec:'#FF5A4E', play:'#9FD89A'};
const api=p=>fetch(p,{method:'POST'}).catch(()=>{});
const NA=new Set(['SCRUB']);
const el=(c,css,t,p)=>{const e=document.createElement('div');if(c)e.className=c;if(css)e.style.cssText=css;if(t!=null)e.textContent=t;(p||W).appendChild(e);return e;};
const latched=new Set(), btnEls={};
/* button: name (API), x,y = top left corner, label, colour, w,h */
function button(name,x,y,label,color,o={}){
  const w=o.w||50,h=o.h||40;
  const b=el('btn'+(NA.has(name)?' na':'')+(o.round?' round':''),`left:${x}px;top:${y}px;width:${w}px;height:${h}px;--c:${color||'#FFB547'}`);
  b.title=name;btnEls[name]=b;
  if(label!=null)el('lbl',`left:${x+w/2-35}px;top:${y+h+4}px`,label);
  if(o.side)el('side',`left:${x-12}px;top:${y+h/2-6}px`,o.side);
  if(o.num)el('side',`left:${x-9}px;top:${y+h/2-6}px`,o.num);
  if(NA.has(name))return b;
  let isDown=false;
  b.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();b.setPointerCapture(e.pointerId);
    if(latched.has(name)){latched.delete(name);b.classList.remove('latched');api('/api/up?b='+name);return;}
    isDown=true;b.classList.add('down');api('/api/down?b='+name);});
  const up=()=>{if(!isDown)return;isDown=false;b.classList.remove('down');api('/api/up?b='+name);};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
  b.addEventListener('contextmenu',e=>{e.preventDefault();
    if(latched.has(name)){latched.delete(name);b.classList.remove('latched');api('/api/up?b='+name);}
    else{latched.add(name);b.classList.add('latched');api('/api/down?b='+name);}});
  return b;
}
function encoder(name,x,y,size,cls,o={}){
  const e=el('enc',`left:${x}px;top:${y}px`+(size?`;width:${size}px;height:${size}px`:''));
  if(cls){e.className=cls;e.style.left=x+'px';e.style.top=y+'px';}
  e.title=name;e.innerHTML='<i></i>';let ang=0,acc=0,dragY=null,pending=0,timer=null;
  const send=d=>{ang+=d*15;e.style.setProperty('--a',ang+'deg');pending+=d;
    if(!timer)timer=setTimeout(()=>{const p=pending;pending=0;timer=null;if(p)api(`/api/enc?e=${name}&d=${p}&wait=0`);},30);};
  e.addEventListener('wheel',ev=>{ev.preventDefault();acc+=ev.deltaY;const st=ev.shiftKey?15:40;
    while(Math.abs(acc)>=st){const d=acc<0?1:-1;send(ev.shiftKey?d*4:d);acc-=(acc<0?-st:st);}},{passive:false});
  const push=o.push;   // midiphy: encoders can be pushed (held = FAST while turning)
  e.addEventListener('pointerdown',ev=>{dragY=ev.clientY;e.setPointerCapture(ev.pointerId);if(push){e.classList.add('pushed');api('/api/down?b='+push);}});
  e.addEventListener('pointermove',ev=>{if(dragY===null)return;const dy=dragY-ev.clientY,st=ev.shiftKey?3:8;
    if(Math.abs(dy)>=st){const n=Math.trunc(dy/st);send(ev.shiftKey?n*4:n);dragY-=n*st;}});
  e.addEventListener('pointerup',()=>{dragY=null;if(push){e.classList.remove('pushed');api('/api/up?b='+push);}});
  return e;
}
/* ---------- midiphy SEQ v4+ layout (left-handed, as on the photo), with 4 OLEDs instead of 2 LCDs ---------- */
el('foot','left:auto;right:30px','').innerHTML='MIDIBOX <b>SEQ</b> V4+ · 4x OLED';
/* One switch type for every button: identical square 1U caps on the 19.05 mm grid (62 px = 19.05 mm, 4 columns = one OLED).
   Rows: encoders 160, GP 203, select 281, function 359, (left only) transport 437 (78 px apart: cap + label strip). */
const CAP={w:58,h:58};          // 18 x 18 mm 1U cap (real size) on the 19.05 mm grid: ~1 mm between caps
const CUTM=3;                    // front plate cutout: 1 mm around the caps of a row
const SCAP={w:35,h:35};          // small key: APEM MEC Multimec 3FTH9 (10 x 10 mm) + 1T 10.6 x 10.6 mm frosted white cap, one-colour 3 mm LED in the switch
const SOFF=(58-35)/2;            // centred on the big-key grid
const SROW=[174.5,228.5,282.5];  // small key rows (top of the 58 px slot): 54 px = 16.6 mm apart (cap + label)
const SCUTM=0.2*62/19.05;          // small keys: 11.0 x 11.0 mm panel hole for the 10.6 mm 1T cap (APEM)
function sbutton(n,k,y,l,c){ el('cut scut',`left:${LX(k)+SOFF-SCUTM}px;top:${y+SOFF-SCUTM}px;width:${SCAP.w+2*SCUTM}px;height:${SCAP.h+2*SCUTM}px`);
  const b=button(n,LX(k)+SOFF,y+SOFF,l,c,SCAP); b.classList.add('small'); return b; }
function cut(x0,x1,y){el('cut',`left:${x0-CUTM}px;top:${y-CUTM}px;width:${x1-x0+2*CUTM}px;height:${CAP.h+2*CUTM}px`);}
const LX=k=>22+k*62;                                  // left block: 5 columns on the same grid
const dw=encoder('DATAWHEEL',130,28,96,'dw',{push:'PUSH_DW'});el('lbl','left:143px;top:128px','DATA');
const beat=el('beat','');beat.style.left='266px';beat.style.top='66px';el('lbl','left:240px;top:88px','BEAT');
el('grp2','left:26px;top:166px;width:298px','SELECT MODE');
cut(LX(0),LX(4)+CAP.w,359);                          // transport row: big keys in one cutout, aligned with the Copy..Utility row
[['STEP_VIEW','STEP'],['TRACK_SEL','TRACK'],['PAR_SEL','PARAM.'],['TRG_SEL','TRIGGER'],['INS_SEL','INSTR.']].forEach(([n,l],k)=>sbutton(n,k,SROW[0],l,PAL.white));
[['MUTE','MUTE'],['PHRASE','PHRASE'],['BOOKMARK','BOOKM.']].forEach(([n,l],k)=>sbutton(n,k,SROW[1],l,PAL.white));
[['SOLO','SOLO'],['METRONOME','METR.']].forEach(([n,l],k)=>sbutton(n,3+k,SROW[1],l,'#FFB547'));
[['LOOP','LOOP'],['RECORD','REC.'],['LIVE','LIVE']].forEach(([n,l],k)=>sbutton(n,k,SROW[2],l,n==='RECORD'?PAL.rec:PAL.amber));
[['REW','◀◀'],['FWD','▶▶'],['STOP','■'],['PLAY','▶'],['PAUSE','❚❚']].forEach(([n,l],k)=>button(n,LX(k),359,l,n==='PLAY'?PAL.play:PAL.white,CAP));
/* right part: 4 OLEDs, 16 push encoders, 16 GP buttons, 16 select buttons, 16 round function buttons */
// Scale: 62 px = 19.05 mm (1U key pitch), MM = px per mm. OLED: Newhaven NHD-3.12-25664UC (datasheet rev. 7, 2024):
// PCB 89.2 x 44.0 mm, bezel 89.0 x 29.6 mm (6.6 mm above PCB bottom), bezel opening 82.0 x 22.0 mm (11.0 mm above PCB bottom),
// active area 76.78 x 19.18 mm, centred, 12.62 mm above PCB bottom. Groups 91.0 mm apart (89.2 mm PCB + 1.8 mm clearance);
// keys 19.05 mm apart within a group (76.2 mm ~ active area). Encoders sit below the OLED PCB (EC11 body ~12 mm).
const MM=62/19.05, GL=360, GP_=91.0*MM, OX=[0,1,2,3].map(g=>GL+g*GP_), OY=50;
const CX=[];for(let d=0;d<4;d++)for(let k=0;k<4;k++)CX.push(OX[d]+31+k*62);   // centre of each GP column
const GPL=['MIXER','EVENT','MODE','DIRECTION','DIVIDER','LENGTH','TRANSPOSE','GROOVE','TRIGGER','FX','MANUAL','MORPH','BPM','SAVE','MIDI','SYS EX'];
const canv=[], OS=4;   // OLED canvas oversampling
const tmpC=document.createElement('canvas');tmpC.width=256;tmpC.height=64;
for(let d=0;d<4;d++){
  const cx0=OX[d]+124, aBot=OY+19.18*MM, pBot=aBot+12.62*MM;                       // group centre, active bottom, PCB bottom
  el('pcb',`left:${cx0-44.6*MM}px;top:${pBot-44*MM}px;width:${89.2*MM}px;height:${44*MM}px`);
  el('bezel',`left:${cx0-44.5*MM}px;top:${pBot-6.6*MM-29.6*MM}px;width:${89*MM}px;height:${29.6*MM}px`);
  el('opening',`left:${cx0-41*MM}px;top:${pBot-11*MM-22*MM}px;width:${82*MM}px;height:${22*MM}px`);
  const c=document.createElement('canvas');c.width=256*OS;c.height=64*OS;c.getContext('2d').setTransform(OS,0,0,OS,0,0);c.className='oled';c.style.cssText=`left:${cx0-38.39*MM}px;top:${OY}px;width:${76.78*MM}px;height:${19.18*MM}px;position:absolute`;W.appendChild(c);canv.push(c);
}
const trkEls=[];
for(let d=0;d<4;d++)[203,281,359].forEach(y=>cut(CX[d*4]-29,CX[d*4+3]+29,y));   // one cutout per row of 4 keys
for(let i=0;i<16;i++){
  const cx=CX[i];
  encoder('GP'+(i+1),cx-17,160,0,null,{push:'PUSH'+(i+1)});
  button('GP'+(i+1),cx-29,203,null,'#FFB547',CAP);      // no printed labels: the OLEDs show what the keys do
  trkEls.push(button('TRK'+(i+1),cx-29,281,null,PAL.amber,CAP));      // select buttons: no labels (as on the midiphy panel)
}
const BOT=['COPY','PASTE','CLEAR','MOVE','SCROLL','FAST','ALL','SELECT','DOWN','UP','EXIT','MENU','EDIT','PATTERN','SONG','UTILITY'];
const BOTL=['COPY','PASTE','CLEAR','MOVE','SCROLL','FAST','ALL','SHIFT','<','>','EXIT','MENU','EDIT','PATTERN','SONG','UTILITY'];
BOT.forEach((n,i)=>button(n,CX[i]-29,359,BOTL[i],'#FFB547',CAP));
/* ---------- OLED content (approximation from the current LCD text) ---------- */
const stepNote=Array(16).fill('----'),stepOn=Array(16).fill(false),stepCur=Array(16).fill(false);
function drawOled(d){
  const c=canv[d],g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,256,64);
  for(let k=0;k<4;k++){
    const i=d*4+k,x=k*64,on=stepOn[i];
    const note=stepNote[i].trim().replace('▒','');
    if(on){                                   // triggered step: clearly filled area
      g.fillStyle='#3a2606';g.fillRect(x+1,0,62,64);
      g.fillStyle='#FFB547';g.fillRect(x+1,0,62,12);               // kopbalk
      g.fillStyle='#000';g.font='bold 10px monospace';g.textAlign='left';g.fillText(String(i+1).padStart(2,'0'),x+4,10);
      g.textAlign='right';g.fillText(note||'ON',x+60,10);
    }else{                                    // step off: dim
      g.fillStyle='#4a3a18';g.font='9px monospace';g.textAlign='left';g.fillText(String(i+1).padStart(2,'0'),x+4,10);
      g.textAlign='right';g.fillText('--',x+60,10);
    }
    g.strokeStyle='#1d1608';g.beginPath();g.moveTo(x+63.5,0);g.lineTo(x+63.5,64);g.stroke();
    const cx=x+32,cy=37,r=17;
    for(let a=0;a<12;a++){const ang=(-225+a*22.5)*Math.PI/180;g.fillStyle=on?(a<9?'#FFD27A':'#7a5a20'):'#2a2008';
      g.fillRect(Math.round(cx+Math.cos(ang)*r)-1,Math.round(cy+Math.sin(ang)*r)-1,on?3:2,on?3:2);}
    g.fillStyle=on?'#FFF2D0':'#3a2e10';g.font='bold 15px monospace';g.textAlign='center';
    g.fillText(on?(note.slice(0,3)||'ON'):'--',cx,cy+5);
    if(on){g.fillStyle='#FFB547';g.fillRect(x+2,54,18,9);g.fillStyle='#000';g.font='bold 8px monospace';g.textAlign='left';g.fillText('ACC',x+3,62);}    if(stepCur[i]){g.strokeStyle='#ffffff';g.lineWidth=2;g.strokeRect(x+2,1,60,62);g.lineWidth=1;}
  }
}
const ch=c=>c===0x7e?'→':c===0x7f?'←':(c>=32&&c<127?String.fromCharCode(c):'▒');
const oledVer=[0,0,0,0], oledReal=[false,false,false,false];
async function drawReal(d){   // 4-bit grey framebuffer from the firmware: 256x64, 128 bytes per row, high nibble = left pixel
  const buf=new Uint8Array(await (await fetch('/oled_raw?d='+d)).arrayBuffer());
  const c=canv[d],g=c.getContext('2d'),t=tmpC.getContext('2d'),im=t.createImageData(256,64);
  for(let y=0;y<64;y++)for(let x=0;x<256;x++){
    const b=buf[y*128+(x>>1)],v=(x&1)?(b&15):(b>>4),o=(y*256+x)*4,k=v/15;
    im.data[o]=Math.round(255*k);im.data[o+1]=Math.round(181*k);im.data[o+2]=Math.round(71*k);im.data[o+3]=255;}
  t.putImageData(im,0,0);g.imageSmoothingEnabled=false;g.drawImage(tmpC,0,0,256,64);
}
let lastBeatSeq=null, beatTimer=null;
function update(s){
  const row0=s.lcd[0].map(c=>c>=32&&c<127?String.fromCharCode(c):' ').join('');
  const inEdit=/^G\dT\d .*P[A-P]:/.test(row0);
  const mb=(s.menu_btn===undefined)?127:s.menu_btn, ownLayout=(mb===1);   // pages with their own OLED layout: no LED mirroring on the GP buttons (the screens show the selection)
  for(let i=0;i<16;i++){const b=btnEls['GP'+(i+1)];if(b)b.classList.toggle('page',i===mb);}        // step/layer page recognised by the header 'G1T1 ... PA:Note'
  // step notes are on the second LCD line: 8 steps per LCD, 5 characters per step
  for(let i=0;i<16;i++){const lcd=i<8?0:1,off=lcd*40+(i%8)*5;
    stepNote[i]=s.lcd[1].slice(off,off+4).map(ch).join('');}
  const lit=[];for(let i=0;i<16;i++){const [g,r]=s.leds['GP'+(i+1)]||[0,0];lit[i]=!!(g||r);}
  for(let i=0;i<16;i++)stepOn[i]=/[^\s\-]/.test(stepNote[i]);          // note present = step triggered
  const nl=lit.filter(Boolean).length;
  for(let i=0;i<16;i++)stepCur[i]=(nl===1&&lit[i]);                    // 1 LED = looplicht (afspeelpositie)
  for(let d=0;d<4;d++){
    if(s.oled_ver&&s.oled_ver[d]>0){ oledReal[d]=true; if(s.oled_ver[d]!==oledVer[d]){ oledVer[d]=s.oled_ver[d]; drawReal(d); } }
    else if(!oledReal[d]) drawOled(d);
  }
  for(const[n,[g,r]]of Object.entries(s.leds)){
    if(n.startsWith('GP')){const b=btnEls[n];if(b){const play=!ownLayout&&!!r&&!g;   // the firmware shows the running step in the other LED colour (red) than triggered steps (green)
      b.classList.toggle('on',!ownLayout&&!!(g||r));b.classList.toggle('play',play);b.style.setProperty('--c',play?'#ffffff':PAL.amber);}continue;}   // GP buttons follow the sequencer on all pages (the OLEDs no longer show the play step)
    const b=btnEls[n];if(b)b.classList.toggle('on',!!g);}
  if(s.sel_g!==undefined){ for(let i=0;i<16;i++){const g=(s.sel_g>>i)&1,r=(s.sel_r>>i)&1,b=trkEls[i];
    b.classList.toggle('on',!!(g||r)); b.style.setProperty('--c', r ? PAL.white : PAL.amber); } }
  // select-mode button of the current view lights up (as on the midiphy panel)
  if(s.sel_view!==undefined){ const SM={1:'BOOKMARK',2:'STEP_VIEW',3:'TRACK_SEL',4:'PAR_SEL',5:'TRG_SEL',6:'INS_SEL',7:'MUTE',8:'PHRASE'};
    for(const [v,n] of Object.entries(SM)){ const b=btnEls[n]; if(b) b.classList.toggle('on', +v===s.sel_view); } }
  if(s.beat_seq!==undefined&&s.beat_seq!==lastBeatSeq){ if(lastBeatSeq!==null){ beat.classList.add('on'); beat.style.opacity=(s.beat_n===0)?'1':'0.7'; clearTimeout(beatTimer); beatTimer=setTimeout(()=>beat.classList.remove('on'),90); } lastBeatSeq=s.beat_seq; }
}
/* ---------- schalen + live ---------- */
function fit(){const s=Math.min(1,(innerWidth-40)/1581);W.style.transform=`scale(${s})`;W.style.marginBottom=(470*s-470+18)+'px';}
addEventListener('resize',fit);fit();
document.getElementById('sync').onclick=e=>{e.preventDefault();api('/api/sync');};
for(let d=0;d<4;d++)drawOled(d);
const es=new EventSource('/events');
es.onmessage=ev=>{const s=JSON.parse(ev.data);update(s);const st=document.getElementById('st');st.textContent=s.online?'online':'offline';st.className=s.online?'on':'off';};

</script><script>
if(new URLSearchParams(location.search).get('caps')==='round')document.body.classList.add('roundcaps');
const capBtn=document.createElement('button');
capBtn.style.cssText='font:600 11px sans-serif;letter-spacing:.05em;padding:5px 10px;border-radius:5px;border:1px solid #555;background:#26282c;color:#eee;cursor:pointer';
const capLbl=()=>{capBtn.textContent='SMALL CAPS: '+(document.body.classList.contains('roundcaps')?'ROUND (1U16)':'SQUARE (1T16)');};
capBtn.onclick=()=>{document.body.classList.toggle('roundcaps');capLbl();};
const ctl=document.createElement('div');ctl.style.cssText='margin:0 18px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center';
document.body.appendChild(ctl);ctl.appendChild(capBtn);capLbl();
/* LED colours to try out. Small keys: one-colour 2x3x4 mm LED in the 3FTH9 (the colour is chosen by buying that LED);
   big keys: SK6812 RGB (any colour; the firmware palette in seq_rgbled.c must follow what is chosen here). Kept in localStorage. */
const LEDOPT={'warm white':'#FFF0DA','cool white':'#E8F0FF','yellow':'#FFD84A','amber':'#FFB547','orange':'#FF8A3D','red':'#FF5A4E','green':'#7EE07E','blue':'#5AA9FF'};
const LEDGRP={sel:['STEP_VIEW','TRACK_SEL','PAR_SEL','TRG_SEL','INS_SEL','MUTE','PHRASE','BOOKMARK'],amb:['SOLO','METRONOME','LOOP','LIVE'],rec:['RECORD']};
const ledCfg=Object.assign({sel:'warm white',amb:'amber',rec:'red',rgbA:PAL.amber,rgbW:PAL.white},JSON.parse(localStorage.getItem('ledCfg')||'{}'));
{const OLD={'warm wit':'warm white','koel wit':'cool white','geel':'yellow','oranje':'orange','rood':'red','groen':'green','blauw':'blue'};   // settings saved by older versions
 for(const k of ['sel','amb','rec'])if(OLD[ledCfg[k]])ledCfg[k]=OLD[ledCfg[k]];}
function applyLed(){
  for(const g in LEDGRP)LEDGRP[g].forEach(n=>{const b=btnEls[n];if(b)b.style.setProperty('--c',LEDOPT[ledCfg[g]]);});
  PAL.amber=ledCfg.rgbA;PAL.white=ledCfg.rgbW;
  for(const n in btnEls){if(/^(GP\d|COPY|PASTE|CLEAR|MOVE|SCROLL|FAST|ALL|SELECT|DOWN|UP|EXIT|MENU|EDIT|PATTERN|SONG|UTILITY)/.test(n)&&!/^TRK/.test(n))btnEls[n].style.setProperty('--c',PAL.amber);
    if(/^TRK/.test(n))btnEls[n].style.setProperty('--c',PAL.amber);
    if(['REW','FWD','STOP','PAUSE'].includes(n))btnEls[n].style.setProperty('--c',PAL.white);}
  localStorage.setItem('ledCfg',JSON.stringify(ledCfg));
}
const ledBox=document.createElement('div');
ledBox.style.cssText='font:600 11px sans-serif;color:#ddd;background:#1d1f22;border:1px solid #444;border-radius:5px;padding:5px 8px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center';
const mkSel=(lbl,key)=>{const l=document.createElement('span');l.textContent=lbl;const sel=document.createElement('select');
  for(const k in LEDOPT){const o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o);}sel.value=ledCfg[key];
  sel.onchange=()=>{ledCfg[key]=sel.value;applyLed();};ledBox.append(l,sel);};
const mkCol=(lbl,key)=>{const l=document.createElement('span');l.textContent=lbl;const c=document.createElement('input');c.type='color';c.value=ledCfg[key];
  c.oninput=()=>{ledCfg[key]=c.value;applyLed();};ledBox.append(l,c);};
const CAPOPT={'mixed: select modes black, Solo/Metr./Loop/Rec./Live frosted':'mix','frosted white (1T16, lets light through)':null,'black (1T09)':'#16171a','grey (1T03)':'#6d6f73','white (1T06)':'#e9e7e2','red (1T08)':'#b3302a','yellow (1T04)':'#e0b324','green (1T02)':'#3f8f4a','blue (1T00)':'#2f5fa8'};
{const l=document.createElement('span');l.textContent='Small cap colour';const sel=document.createElement('select');
 for(const k in CAPOPT){const o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o);}
 const ap=()=>{const c=CAPOPT[sel.value];const mix=c==='mix';document.body.style.setProperty('--capc',mix?'#16171a':(c||'#16171a'));
 for(const g in LEDGRP)LEDGRP[g].forEach(n=>{const b=btnEls[n];if(b)b.classList.toggle('opq',mix?g==='sel':!!c);});ledCfg.cap=sel.value;localStorage.setItem('ledCfg',JSON.stringify(ledCfg));};
 sel.value=ledCfg.cap&&ledCfg.cap in CAPOPT?ledCfg.cap:'mixed: select modes black, Solo/Metr./Loop/Rec./Live frosted';sel.onchange=ap;ledBox.append(l,sel);setTimeout(ap,0);}
mkSel('LED select mode','sel');mkSel('LED Solo/Metr./Loop/Live','amb');mkSel('LED Rec.','rec');
mkCol('RGB active (GP, select, function)','rgbA');mkCol('RGB current track / transport','rgbW');
const rst=document.createElement('button');rst.textContent='defaults';rst.style.cssText='font:600 10px sans-serif;cursor:pointer';
rst.onclick=()=>{localStorage.removeItem('ledCfg');location.reload();};ledBox.append(rst);
ctl.appendChild(ledBox);applyLed();
addEventListener('keydown',e=>{if((e.key==='c'||e.key==='C')&&!e.ctrlKey&&!e.metaKey){document.body.classList.toggle('roundcaps');capLbl();}});
</script></body></html>
